name: Baidu live smoke

on:
  schedule:
    # 每天 01:00 UTC = 北京时间 09:00；每次 4 次调用，约占免费额度 8%/月
    - cron: '0 1 * * *'
  push:
    branches: [master]
    paths: ['index.js', 'lib/**', '.github/live-smoke.mjs']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Run live smoke test
        env:
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
        run: node .github/live-smoke.mjs
