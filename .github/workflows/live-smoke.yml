name: Baidu live smoke

# 只手动运行（Actions → Baidu live smoke → Run workflow），每次 5 次调用、消耗百度免费额度。
# 改了请求构造（lib/、index.js）或怀疑百度接口有变化时跑一次。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Run live smoke test
        env:
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}
        run: node .github/live-smoke.mjs
