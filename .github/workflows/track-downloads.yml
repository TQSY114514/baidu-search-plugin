name: Track ClawHub downloads

on:
  schedule:
    # 每天 02:00 UTC = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch downloads and update data
        run: node .github/track-downloads.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore: update ClawHub download stats"
            git push
          fi
