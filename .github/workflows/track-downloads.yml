name: Track ClawHub downloads

on:
  schedule:
    # 每天 15:00 UTC = 北京时间 23:00（记录当天完整累计，深夜负载低）
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch downloads and update data
        run: node .github/track-downloads.mjs

      - name: Render chart SVG
        run: node .github/render-chart.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json chart.svg
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore: update ClawHub download stats and chart"
            git push
          fi
