name: Check alerts

# Opens one issue when a background check fails and closes it when that check
# passes again, so breakage (Baidu API changes, an expired key, an OpenClaw SDK
# change, ClawHub page changes) shows up in Issues without watching Actions.
on:
  workflow_run:
    workflows: [Baidu live smoke, OpenClaw SDK compat, Track ClawHub downloads]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Open or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Check failing: $WORKFLOW"
          number=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t))[0].number // empty')
          if [[ "$CONCLUSION" == "failure" && -z "$number" ]]; then
            gh issue create --title "$title" --body "后台检查 **$WORKFLOW** 失败了，运行记录：$RUN_URL

          检查恢复通过后，这个 issue 会自动关闭。

          The background check **$WORKFLOW** failed: $RUN_URL. This issue closes itself once the check passes again."
          elif [[ "$CONCLUSION" == "success" && -n "$number" ]]; then
            gh issue close "$number" --comment "已恢复 / Passing again: $RUN_URL"
          fi
