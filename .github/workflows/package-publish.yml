name: Package publish

# Real publishes: Actions → "Package publish" → Run workflow (dry_run off).
# Auth is ClawHub trusted publishing via GitHub OIDC (no stored token), bound to
# this repo + this workflow filename + workflow_dispatch. Pull requests get a
# dry run, which needs no auth.
#
# The CLI runs directly in this job: ClawHub's reusable workflow builds a newer
# CLI whose scoped token mint is rejected by the registry (verified 2026-10-01),
# while the npm CLI's mint succeeds for this trusted-publisher config.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (no upload)
        type: boolean
        default: false
      changelog:
        description: Release notes shown on ClawHub
        type: string
        required: false
  pull_request:
    branches: [master]
    paths: ['index.js', 'lib/**', 'package.json', 'openclaw.plugin.json', 'README*.md']

permissions: {}

concurrency:
  group: package-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Publish to ClawHub
        env:
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          args=(package publish . --family code-plugin --no-input
                --source-repo "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          else
            args+=(--wait --wait-timeout 1800)
          fi
          if [[ -n "$CHANGELOG" ]]; then args+=(--changelog "$CHANGELOG"); fi
          npx --yes clawhub@0.23.3 "${args[@]}"
